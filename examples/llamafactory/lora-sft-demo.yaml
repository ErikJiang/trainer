apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llamafactory-lora-sft
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 30Gi
  storageClassName: nfs-client-test
  volumeMode: Filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamafactory-lora-sft-config
data:
  training.yaml: |
    ### model
    model_name_or_path: /workspace/model
    trust_remote_code: true

    ### method
    stage: sft
    do_train: true
    finetuning_type: lora
    lora_rank: 8
    lora_alpha: 16
    lora_dropout: 0.05
    lora_target: q_proj,v_proj

    ### dataset
    dataset_dir: /config
    dataset: alpaca_en_demo
    template: qwen3_nothink
    cutoff_len: 1024
    max_samples: 500
    val_size: 0.1
    preprocessing_num_workers: 4

    ### output
    output_dir: /workspace/output
    logging_steps: 5
    save_steps: 20
    save_total_limit: 2
    plot_loss: true
    overwrite_output_dir: true

    ### train
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-4
    num_train_epochs: 1.0
    do_eval: true
    per_device_eval_batch_size: 2
    eval_strategy: steps
    eval_steps: 20
    lr_scheduler_type: cosine
    warmup_ratio: 0.1
    seed: 42
    report_to: none
    bf16: true

  dataset_info.json: |
    {
      "alpaca_en_demo": {
        "file_name": "/workspace/dataset/data"
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llamafactory-lora-sft-demo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamafactory-lora-sft-demo
    spec:
      restartPolicy: Never
      initContainers:
      - name: dataset-initializer
        image: ghcr.io/kubeflow/trainer/dataset-initializer:v2.1.0
        env:
        - name: HF_ENDPOINT
          value: https://hf-mirror.com
        - name: STORAGE_URI
          value: hf://tatsu-lab/alpaca
        volumeMounts:
        - mountPath: /workspace
          name: workspace
      - name: model-initializer
        image: ghcr.io/kubeflow/trainer/model-initializer:v2.1.0
        env:
        - name: HF_ENDPOINT
          value: https://hf-mirror.com
        - name: STORAGE_URI
          value: hf://Qwen/Qwen3-0.6B
        volumeMounts:
        - mountPath: /workspace
          name: workspace
      containers:
      - name: trainer
        image: llamafactory-prometheus:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PROMETHEUS_REMOTE_WRITE_URL
          value: http://prometheus-operated.monitoring.svc:9090
        - name: TRAIN_RUN_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: PROM_REMOTE_WRITE_JOB_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['job-name']
        - name: PROM_REMOTE_WRITE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROM_REMOTE_WRITE_TIMEOUT_SECONDS
          value: "2.0"
        - name: PROM_REMOTE_WRITE_MODEL_NAME
          value: Qwen3-0.6B
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "[job] Launching single-node LoRA SFT with torchrun and Prometheus remote write"
          exec torchrun \
            --standalone \
            --nnodes=1 \
            --nproc_per_node=1 \
            -m llamafactory_ext.train \
            /config/training.yaml
        resources:
          requests:
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - mountPath: /workspace
          name: workspace
        - mountPath: /config
          name: training-config
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: llamafactory-lora-sft
      - name: training-config
        configMap:
          name: llamafactory-lora-sft-config
