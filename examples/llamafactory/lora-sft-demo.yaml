apiVersion: v1
kind: ConfigMap
metadata:
  name: llamafactory-lora-sft-config
data:
  training.yaml: |
    ### model
    model_name_or_path: /workspace/model
    trust_remote_code: true

    ### method
    stage: sft
    do_train: true
    finetuning_type: lora
    lora_rank: 8
    lora_alpha: 16
    lora_dropout: 0.05
    lora_target: q_proj,v_proj

    ### dataset
    dataset_dir: /config
    dataset: alpaca_en_demo
    template: qwen3_nothink
    cutoff_len: 1024
    max_samples: 500
    val_size: 0.1
    preprocessing_num_workers: 4

    ### output
    output_dir: /workspace/output
    logging_steps: 5
    save_steps: 20
    save_total_limit: 2
    plot_loss: true
    overwrite_output_dir: true

    ### train
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-4
    num_train_epochs: 1.0
    do_eval: true
    per_device_eval_batch_size: 2
    eval_strategy: steps
    eval_steps: 20
    lr_scheduler_type: cosine
    warmup_ratio: 0.1
    seed: 42
    report_to: none
    bf16: true
    ddp_timeout: 180000000

  dataset_info.json: |
    {
      "alpaca_en_demo": {
        "file_name": "/workspace/dataset/data"
      }
    }

  ds_config.json: |
    {
      "train_batch_size": "auto",
      "train_micro_batch_size_per_gpu": "auto",
      "gradient_accumulation_steps": "auto",
      "gradient_clipping": "auto",
      "zero_allow_untested_optimizer": true,
      "fp16": {
        "enabled": "auto",
        "loss_scale": 0,
        "loss_scale_window": 1000,
        "initial_scale_power": 16,
        "hysteresis": 2,
        "min_loss_scale": 1
      },
      "bf16": {
        "enabled": "auto"
      },
      "zero_optimization": {
        "stage": 2,
        "allgather_partitions": true,
        "allgather_bucket_size": 5e8,
        "overlap_comm": false,
        "reduce_scatter": true,
        "reduce_bucket_size": 5e8,
        "contiguous_gradients": true,
        "round_robin_gradients": true
      }
    }

  accelerate_config.yaml: |
    compute_environment: LOCAL_MACHINE
    debug: false
    deepspeed_config:
      deepspeed_multinode_launcher: standard
      deepspeed_config_file: /config/ds_config.json
    distributed_type: DEEPSPEED
    downcast_bf16: 'no'
    machine_rank: ${PET_NODE_RANK}
    main_process_ip: '${PET_MASTER_ADDR}'
    main_process_port: ${PET_MASTER_PORT}
    main_training_function: main
    mixed_precision: bf16
    num_machines: ${PET_NNODES}
    num_processes: ${TOTAL_PROCS}
    rdzv_backend: static
    same_network: true
    use_cpu: false
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: llamafactory-lora-sft-demo
spec:
  runtimeRef:
    name: llamafactory-lora-sft
  trainer:
    numNodes: 2
    resourcesPerNode:
      requests:
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1
