name: Build and Push LLaMA Factory Trainer Image

on:
  push:
    branches:
      - master
      - "release-*"
      - llamafactory_integration_01
    paths:
      - "cmd/trainers/llamafactory/**"
      - ".github/workflows/build-llamafactory-image.yaml"
  pull_request:
    paths:
      - "cmd/trainers/llamafactory/**"
      - ".github/workflows/build-llamafactory-image.yaml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Custom image tag (e.g. v0.1.0). Defaults to git SHA if empty."
        required: false
        type: string

env:
  IMAGE_NAME: llamafactory-trainer
  DOCKERFILE: cmd/trainers/llamafactory/Dockerfile
  PLATFORMS: linux/amd64

jobs:
  build:
    name: Build LLaMA Factory Trainer Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/trainer/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,ignore-error=true
